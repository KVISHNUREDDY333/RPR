<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - RPR</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-page">
  <div class="card auth-card">
    <div class="auth-logo">
      <h1>RPR</h1>
      <p>AI Research Paper Refinement</p>
    </div>
    <h2>Sign In</h2>

    <div id="error" class="alert alert-error hidden"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary w-full justify-center">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (localStorage.getItem("rpr_token")) window.location.href = "dashboard.html";
  </script>
</body>
</html>
