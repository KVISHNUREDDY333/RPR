<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — RPR</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-page">
  <div class="card auth-card">
    <div class="auth-logo">
      <h1>RPR</h1>
      <p>AI Research Paper Refinement</p>
    </div>
    <h2>Welcome back</h2>

    <div id="error" class="alert alert-error hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@university.edu" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁</button>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top:8px;">Sign In</button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (localStorage.getItem("rpr_token")) window.location.href = "dashboard.html";
    document.getElementById("login-form").addEventListener("submit", handleLogin);
    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      el.type = el.type === "password" ? "text" : "password";
      btn.textContent = el.type === "password" ? "👁" : "🙈";
    }
  </script>
</body>
</html>
