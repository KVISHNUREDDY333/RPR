<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — RPR</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body class="auth-page">
  <div class="card auth-card">
    <div class="auth-logo">
      <h1>RPR</h1>
      <p>AI Research Paper Refinement</p>
    </div>
    <h2>Create your account</h2>

    <div id="error" class="alert alert-error hidden"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Dr. Jane Smith" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@university.edu" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Min 8 characters" minlength="8" required autocomplete="new-password" oninput="checkStrength(this.value)" />
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁</button>
        </div>
        <div id="strength-bar" class="strength-bar hidden"></div>
        <div id="strength-label" class="strength-label text-muted hidden"></div>
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top:8px;">Create Account</button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (localStorage.getItem("rpr_token")) window.location.href = "dashboard.html";
    document.getElementById("signup-form").addEventListener("submit", handleSignup);

    function togglePassword(id, btn) {
      const el = document.getElementById(id);
      el.type = el.type === "password" ? "text" : "password";
      btn.textContent = el.type === "password" ? "👁" : "🙈";
    }

    function checkStrength(val) {
      const bar = document.getElementById("strength-bar");
      const lbl = document.getElementById("strength-label");
      bar.classList.remove("hidden"); lbl.classList.remove("hidden");
      bar.className = "strength-bar";
      if (val.length < 8) {
        bar.classList.add("strength-weak"); lbl.textContent = "Weak"; lbl.style.color = "var(--error)";
      } else if (val.length < 12 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) {
        bar.classList.add("strength-medium"); lbl.textContent = "Medium"; lbl.style.color = "var(--warning)";
      } else {
        bar.classList.add("strength-strong"); lbl.textContent = "Strong"; lbl.style.color = "var(--success)";
      }
    }
  </script>
</body>
</html>
